name: Dictionary browser checks
on:
  push:
    branches: [qa/dictionary-usability]
    paths:
      - 'index.html'
      - 'trainer.html'
      - 'qa/smoke.cjs'
      - 'assets/**'
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: node qa/smoke.cjs
